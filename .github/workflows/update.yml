name: Auto-update daily portfolio data

on:
  schedule:
    # UTC 时间 00:00 = 北京时间 08:00
    - cron: '17 21 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Update portfolio data
        run: node scripts/update_data_improved.js
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}

      - name: Debug - Show data/data.json
        if: always()
        run: |
          echo "=== data/data.json 内容预览 ==="
          head -50 data/data.json
          echo "..."

      - name: Commit and push changes
        if: success()
        run: |
          git config user.name "Portfolio Bot"
          git config user.email "bot@portfolio.local"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update portfolio data - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "Changes pushed successfully"
          fi
